<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Sipag Hosting</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="top-banner">
    Sipag sa Server, Walang Lag sa Gamer.
  </div>

  <header class="header">
    <a href="index.html" class="brand-container brand-link">
      <div class="logo-container">
        <img src="images/logo.png" alt="Sipag Hosting Logo" />
      </div>
      <h1 class="brand-title">SIPAG <span>HOSTING</span></h1>
    </a>
  </header>

  <main class="auth-stage">
    <div class="auth-card">
      <h2 class="auth-title">Create Your Account</h2>
      <p class="auth-subtitle">Selected Plan: <strong id="selected-plan-display">Loading...</strong></p>

      <form class="auth-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Registration submitted successfully!');">
        
        <input type="hidden" id="plan-input" name="plan" value="" />
        <input type="hidden" id="billing-input" name="billing" value="" />

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Juan Dela Cruz" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="juan@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit">Complete Registration</button>
      </form>

      <p class="auth-footer-text">
          Already have an account? <a href="login.html">Log In</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">SIPAG HOSTING</div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="#">Status</a>
        <a href="#">Terms of Service</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const plan = urlParams.get('plan') || 'Copper Ingot';
    const period = urlParams.get('period') || 'monthly';

    const readablePeriod = period === 'half-year' ? '6 Months' : period === 'yearly' ? '1 Year' : 'Monthly';

    document.getElementById('selected-plan-display').textContent = `${plan} (${readablePeriod})`;
    document.getElementById('plan-input').value = plan;
    document.getElementById('billing-input').value = period;
  </script>
</body>
</html>
